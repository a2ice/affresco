name: AFFRESCO — Generate room photo with OpenAI
on:
  workflow_dispatch:
    inputs:
      generation_id: {required: true, type: string}
permissions:
  contents: read
concurrency:
  group: affresco-image-${{ inputs.generation_id }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CALLBACK_SECRET: ${{ secrets.AFFRESCO_AI_CALLBACK_SECRET }}
      GENERATION_ID: ${{ inputs.generation_id }}
      PUBLIC_URL: ${{ vars.AFFRESCO_AI_PUBLIC_URL }}
    steps:
      - name: Generate and notify AFFRESCO
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$OPENAI_API_KEY" && test -n "$CALLBACK_SECRET"
          callback_url=""
          callback() {
            local status="$1" image_path="$2" timestamp digest signature
            timestamp="$(date +%s)"
            digest="$(printf '' | sha256sum | awk '{print $1}')"
            if [[ -n "$image_path" ]]; then digest="$(sha256sum "$image_path" | awk '{print $1}')"; fi
            signature="$(printf '%s\n%s\n%s\n%s' "$timestamp" "$GENERATION_ID" "$status" "$digest" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $NF}')"
            if [[ -n "$image_path" ]]; then
              curl --silent --show-error --fail-with-body -X POST "$callback_url" \
                -H "X-Affresco-Timestamp: $timestamp" -H "X-Affresco-Signature: $signature" \
                -F "status=$status" -F "image=@$image_path;type=image/png" >/dev/null
            else
              curl --silent --show-error --fail-with-body -X POST "$callback_url" \
                -H "X-Affresco-Timestamp: $timestamp" -H "X-Affresco-Signature: $signature" \
                -F "status=$status" >/dev/null
            fi
          }
          failed() {
            local status=$?
            trap - ERR
            if [[ -n "$callback_url" ]]; then callback failed "" || true; fi
            exit "$status"
          }
          trap failed ERR
          PUBLIC_URL="${PUBLIC_URL:-https://affresco.a2ice.ru}"
          case "$PUBLIC_URL" in https://affresco.a2ice.ru|https://afreska.2ice.ru) ;; *) echo "Unsupported AFFRESCO host" >&2; exit 1 ;; esac
          expiry="$(($(date +%s)+600))"
          signature="$(printf '%s\n%s' "$GENERATION_ID" "$expiry" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $NF}')"
          curl -fsSL "$PUBLIC_URL/api/ai-tryon.php?manifest=$GENERATION_ID&exp=$expiry&sig=$signature" -o manifest.json
          test "$(jq -r '.generation_id' manifest.json)" = "$GENERATION_ID"
          callback_url="$(jq -r '.callback_url' manifest.json)"
          case "$callback_url" in https://*/api/ai-tryon.php?callback=*) ;; *) echo 'Invalid callback URL' >&2; exit 1 ;; esac
          callback processing ""
          jq -er '.references | length == 3' manifest.json >/dev/null
          for i in 0 1 2; do
            url="$(jq -r ".references[$i]" manifest.json)"
            curl -fsSL "$url" -o "reference-$i.jpg"
          done
          model="$(jq -r '.openai.model' manifest.json)"
          size="$(jq -r '.openai.size' manifest.json)"
          quality="$(jq -r '.openai.quality' manifest.json)"
          prompt="$(jq -r '.prompt' manifest.json)"
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --max-time 700 -X POST https://api.openai.com/v1/images/edits \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -F "model=$model" \
            -F "image[]=@reference-0.jpg;type=image/jpeg" \
            -F "image[]=@reference-1.jpg;type=image/jpeg" \
            -F "image[]=@reference-2.jpg;type=image/jpeg" \
            --form-string "prompt=$prompt" \
            -F "size=$size" -F "quality=$quality" -F "output_format=png")"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "OpenAI image edit HTTP $status" >&2
            false
          fi
          jq -er '.data[0].b64_json' response.json | base64 --decode > result.png
          file result.png | grep -q 'PNG image data'
          test "$(stat -c%s result.png)" -le 12582912
          callback completed result.png
          trap - ERR
